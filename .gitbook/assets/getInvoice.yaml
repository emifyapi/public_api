  /api/invoices:
    post:
      tags:
        - Documents
        - invoices
      summary: Create Invoice
      description: >-
        This endpoint allows you to create a new invoice by sending a POST
        request to the specified URL. The request should include a JSON payload
        in the raw request body, containing details such as branch office,
        invoice type, dates, concept, issuer information, recipient information,
        currency, payment method, items, and totals. Each section of the payload
        should be filled with relevant information for the invoice.


        The response will provide details about the newly created invoice,
        including an invoice ID, status, and any relevant payment information.
        Ensure that the request body and response are structured according to
        the provided schema for successful invoice creation.
      operationId: createInvoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                billing_reference:
                  type: array
                  items:
                    type: object
                    properties:
                      branch_office:
                        type: number
                        example: 1
                      invoice_date:
                        type: string
                        example: '2024-06-19 08:00:00'
                      invoice_type:
                        type: string
                        example: FCA
                      number:
                        type: number
                        example: 2507
                  example:
                    - branch_office: 1
                      invoice_date: '2024-06-19 08:00:00'
                      invoice_type: FCA
                      number: 2507
                branch_office:
                  type: number
                  example: 1
                concept:
                  type: string
                  example: '3'
                currency:
                  type: object
                  properties:
                    code:
                      type: string
                      example: ARS
                    exchange_rate:
                      type: number
                      example: 1
                external_reference:
                  type: string
                  example: '103513337'
                invoice_date:
                  type: string
                  example: '2024-06-18 08:00:00'
                issuer:
                  type: object
                  properties:
                    address:
                      type: object
                      properties:
                        address:
                          type: string
                          example: SUIPACHA 250 1
                        country:
                          type: string
                          example: ARG
                        phone:
                          type: string
                          example: 0810-1566666666
                        state:
                          type: string
                          example: Ciudad de Buenos Aires
                    document_number:
                      type: string
                      example: '20309807430'
                    document_type:
                      type: string
                      example: CUIT
                    legal_name:
                      type: string
                      example: Demo SRL
                    tax_information:
                      type: object
                      properties:
                        start_activities_date:
                          type: string
                          example: value2
                        tax_condition:
                          type: string
                          example: value1
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      code:
                        type: object
                        properties:
                          type:
                            type: string
                            example: sku
                          value:
                            type: string
                            example: 1HSCONSUL
                      description:
                        type: string
                        example: 1HSCONSUL
                      discount_amount:
                        type: number
                        example: 0
                      quantity:
                        type: number
                        example: 1
                      taxes:
                        type: array
