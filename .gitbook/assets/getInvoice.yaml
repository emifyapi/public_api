  /api/currencies:
    get:
      tags:
        - System Configuration
        - currencies1
      summary: currencies
      description: >-
        This endpoint makes an HTTP GET request to retrieve currency information
        based on the provided ID.


        ### Example Response


        ``` json

        [
            {
                "id": 0,
                "id_country": 0,
                "description": "",
                "currency_code": "",
                "iso_code": "",
                "agency_code": "",
                "state": ""
            }
        ]

         ```

        The response is a JSON array containing currency information with the
        following data types:


        - `id`: Number
            
        - `id_country`: Number
            
        - `description`: String
            
        - `currency_code`: String
            
        - `iso_code`: String
            
        - `agency_code`: String
            
        - `state`: String
            

        The response to the last execution of this request had a status code of
        200 and a content type of application/json. The response body is a JSON
        array containing objects with the following properties:


        - id (number): The ID of the currency
            
        - id_country (number): The ID of the country associated with the
        currency
            
        - description (string): Description of the currency
            
        - currency_code (string): Currency code
            
        - iso_code (string): ISO code of the currency
            
        - agency_code (string): Agency code
            
        - state (string): State of the currency
            

        Agrega un bloque de codigo a la documentacion indicando el tipo de dato
        del cuerpo de la respuesta


        ``` json

        [
            {
                "id": 0,
                "id_country": 0,
                "description": "",
                "currency_code": "",
                "iso_code": "",
                "agency_code": "",
                "state": ""
            }
        ]

         ```

        ### Request Parameters


        - id: The ID of the currency to retrieve.
            

        ### Response


        The response will have a status code of 200 and a content type of
        application/json. The body of the response will contain an array of
        currency objects, each with the following properties:


        - id: The ID of the currency.
            
        - id_country: The ID of the country associated with the currency.
            
        - description: The description of the currency.
            
        - currency_code: The currency code.
            
        - iso_code: The ISO code of the currency.
            
        - agency_code: The agency code of the currency.
            
        - state: The state of the currency.
      operationId: currencies
      parameters:
        - name: id
          in: query
          schema:
            type: string
            example: '1'
        - name: state
          in: query
          schema:
            type: string
            example: B
        - name: codigo_iso
          in: query
          schema:
            type: string
            example: ARS
      responses:
        '200':
          description: ''
      security:
        - bearerAuth: []
